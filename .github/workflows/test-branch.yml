name: Branch Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - ajustes

jobs:
  package:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-appimage
            package_path: dist/Mellodica-x86_64.AppImage
          - os: windows-latest
            artifact_name: windows-standalone
            package_path: dist/Mellodica-Windows.zip
          - os: macos-latest
            artifact_name: macos-standalone
            package_path: dist/Mellodica-macOS.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y \
            g++ cmake ninja-build \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libfluidsynth-dev libglew-dev libgl1-mesa-dev \
            patchelf desktop-file-utils file

      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-fluidsynth
            mingw-w64-x86_64-glew

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install \
            cmake glib jack sdl2 sdl2_image sdl2_ttf \
            glew libsndfile pkg-config gettext dylibbundler

      - name: Build FluidSynth (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          curl -L -o fluidsynth.tar.gz \
            https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.4.8.tar.gz
          tar xf fluidsynth.tar.gz
          mv fluidsynth-2.4.8 fluidsynth
          cd fluidsynth
          mkdir build && cd build
          cmake .. \
            -Denable-sdl2=1 \
            -Denable-framework=0 \
            -Denable-floats=1 \
            -Denable-libsndfile=1 \
            -Denable-gentables=0 \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          make -j"$(sysctl -n hw.logicalcpu)"
          sudo make install
          sudo update_dyld_shared_cache

      - name: Configure CMake (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build --config Release -j2

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export CMAKE_PREFIX_PATH=/mingw64
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          export CC=/mingw64/bin/gcc.exe
          export CXX=/mingw64/bin/g++.exe
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake --build build --config Release -j2

      - name: Prepare AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/AppDir/usr/bin
          mkdir -p dist/AppDir/usr/share/applications
          mkdir -p dist/AppDir/usr/share/icons/hicolor/64x64/apps

          cp build/mellodica dist/AppDir/usr/bin/
          cp -r assets dist/AppDir/usr/bin/
          cp assets/mellodica.desktop dist/AppDir/usr/share/applications/mellodica.desktop
          cp assets/mellodica.png dist/AppDir/usr/share/icons/hicolor/64x64/apps/mellodica.png

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export PATH="$PATH:$PWD"
          ./linuxdeploy-x86_64.AppImage \
            --appdir dist/AppDir \
            --desktop-file=dist/AppDir/usr/share/applications/mellodica.desktop \
            --icon-file=dist/AppDir/usr/share/icons/hicolor/64x64/apps/mellodica.png \
            --output appimage
          mv Mellodica-x86_64.AppImage dist/Mellodica-x86_64.AppImage

      - name: Prepare Windows standalone
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          mkdir -p dist/Mellodica-Windows
          cp build/mellodica.exe dist/Mellodica-Windows/
          cp -r assets dist/Mellodica-Windows/

          ldd build/mellodica.exe | awk '/=> \/mingw64\/bin\/.*\.dll/ {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/Mellodica-Windows/
          done

      - name: Zip Windows package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Mellodica-Windows\* -DestinationPath dist\Mellodica-Windows.zip -Force

      - name: Prepare macOS standalone
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/Mellodica-macOS
          cp build/mellodica dist/Mellodica-macOS/
          cp -r assets dist/Mellodica-macOS/
          chmod +x dist/Mellodica-macOS/mellodica

          mkdir -p dist/Mellodica-macOS/libs
          dylibbundler -od -b \
            -x dist/Mellodica-macOS/mellodica \
            -d dist/Mellodica-macOS/libs \
            -p @executable_path/libs/

      - name: Zip macOS package
        if: matrix.os == 'macos-latest'
        run: |
          ditto -c -k --keepParent dist/Mellodica-macOS dist/Mellodica-macOS.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: mellodica-${{ matrix.artifact_name }}
          path: ${{ matrix.package_path }}